# ==================== 基础配置 ====================
spring.application.name=${APP_NAME:TravelGuidePlatform}

# ==================== Spring AI 配置 ====================
spring.ai.dashscope.api-key=${DASHSCOPE_API_KEY:your_api_key_here}
spring.ai.dashscope.chat.options.model=${AI_MODEL:DeepSeek-V4.1-Flash}

# ==================== 文件上传限制 ====================
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:20MB}

# ==================== 邮件配置 ====================
spring.mail.host=${MAIL_HOST:smtp.qq.com}
spring.mail.port=${MAIL_PORT:465}
spring.mail.username=${MAIL_USERNAME:your_email@example.com}
spring.mail.password=${MAIL_PASSWORD:your_auth_code_here}
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.socketFactory.class=javax.net.ssl.SSLSocketFactory
spring.mail.properties.mail.smtp.socketFactory.port=${MAIL_PORT:465}

# ==================== RabbitMQ 配置 ====================
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.connection-timeout=${RABBITMQ_TIMEOUT:2000}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}
spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.listener.simple.prefetch=${RABBITMQ_PREFETCH:1}
spring.rabbitmq.template.retry.enabled=true
spring.rabbitmq.template.retry.initial-interval=1000ms
spring.rabbitmq.template.retry.max-attempts=3
spring.rabbitmq.template.retry.multiplier=2.0
spring.rabbitmq.template.retry.max-interval=5000ms

# ==================== Redis 配置 ====================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.database=${REDIS_DATABASE:0}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.connect-timeout=${REDIS_TIMEOUT:5000}

# ==================== 数据库配置 ====================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/your_database_name?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==================== 日志配置 ====================
logging.level.org.springframework.ai.chat.client.advisor=${LOG_LEVEL_AI:debug}
logging.level.com.mpq=${LOG_LEVEL_APP:debug}
logging.level.com.mpq.alibaba=${LOG_LEVEL_APP:debug}
logging.level.com.mpq.controller=${LOG_LEVEL_APP:debug}
logging.level.com.alibaba.dashscope.app=${LOG_LEVEL_AI:debug}

# ==================== MyBatis-Plus 配置 ====================
mybatis-plus.mapper-locations=classpath:mapper/*.xml
mybatis-plus.type-enums-package=com.mpq.pojo
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.configuration.use-actual-param-name=true
mybatis-plus.type-aliases-package=com.mpq.pojo
mybatis-plus.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
mybatis-plus.global-config.db-config.id-type=auto
mybatis-plus.global-config.db-config.logic-delete-value=1
mybatis-plus.global-config.db-config.logic-not-delete-value=0

# ==================== JWT 配置 ====================
jwt.secret=${JWT_SECRET:your_jwt_secret_key_change_me_in_production}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ==================== MinIO 配置 ====================
minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
minio.access-key=${MINIO_ACCESS_KEY:minioadmin}
minio.secret-key=${MINIO_SECRET_KEY:minioadmin}
minio.bucket-name=${MINIO_BUCKET:user-avatars}
minio.video-prefix=${MINIO_VIDEO_PREFIX:videos/}
minio.article-media-name=${MINIO_MEDIA:article-media}

# ==================== 自定义配置 ====================
chat.history.max-rounds=${CHAT_MAX_ROUNDS:10}
default.avatar=${DEFAULT_AVATAR:}
Application.id.content=${DASHSCOPE_APP_ID:your_app_id_here}

# ==================== 监控与指标配置 ====================
management.endpoints.web.exposure.include=${METRICS_ENDPOINTS:prometheus,health,info}
management.endpoint.health.show-details=${HEALTH_DETAILS:always}
management.metrics.tags.application=${spring.application.name}
management.metrics.enable.threadpool=true
management.metrics.enable.http=true
management.metrics.enable.jvm=true
management.prometheus.metrics.export.enabled=true
management.prometheus.metrics.export.step=15s